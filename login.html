<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/login.css">
    <title>Document</title>
</head>
<body>
    <div class="loginBox"> <img class="user" src="https://i.ibb.co/yVGxFPR/2.png" height="100px" width="100px">
        <h3>Inicia Sesion</h3>
        <form action="login.php" method="post">
            <div class="inputBox"> 
                <input id="uname" type="text" name="Username" placeholder="Usuario"> 
                <input id="pass" type="password" name="Password" placeholder="Contraseña"> 
            </div> 
            <input type="submit" name="" value="Iniciar Sesión">
        </form>
        <a href="#"><br> </a>
        <div class="text-center">
            <p style="color: #59238F;"></p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
<script>
    document.querySelector("form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const tipo = document.querySelector("#tipo").value; // Tipo de usuario (alumno o administrativo)
        const usuario = document.querySelector("#uname").value;
        const contraseña = document.querySelector("#pass").value;

        try {
            const response = await fetch("/api/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ tipo, usuario, contraseña }),
                
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem("token", data.token); // Guardar el token en localStorage
                alert("Inicio de sesión exitoso");
                window.location.href = "index.html"; // Redirigir al inicio
            } else {
                alert(data.error || "Error al iniciar sesión");
            }
        } catch (error) {
            console.error("Error:", error);
            alert("Error al conectar con el servidor");
        }
    });
</script>
</html>
