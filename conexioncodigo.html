    // Mostrar el formulario de agregar empresa
    const showAddFormButton = document.getElementById("show-add-form");
    const addForm = document.getElementById("add-form");

    showAddFormButton.addEventListener("click", () => {
        addForm.style.display = addForm.style.display === "none" ? "block" : "none";
    });

    // Manejar el envío del formulario de agregar empresa
    addForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const nuevaEmpresa = {
            nombre: document.getElementById("nombre").value,
            estado: document.getElementById("estado").value,
            ciudad: document.getElementById("ciudad").value,
            calle: document.getElementById("calle").value,
            sector: document.getElementById("sector").value,
            carrera: document.getElementById("carrera").value,
            plazas_disponibles: document.getElementById("plazas_disponibles").value,
            numero_telefonico: document.getElementById("numero_telefonico").value,
            representante: document.getElementById("representante").value,
        };

        try {
            const response = await fetch("/api/empresas", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${token}`,
                },
                body: JSON.stringify(nuevaEmpresa),
            });

            if (!response.ok) {
                throw new Error("Error al agregar la empresa");
            }

            const data = await response.json();
            alert(data.mensaje);

            // Agregar la nueva empresa a la tabla
            const tableBody = document.querySelector("tbody");
            const row = document.createElement("tr");
            row.innerHTML = `
                    <td data-th="Id">${data.id}</td>
                    <td data-th="Nombre de la Empresa">${nuevaEmpresa.nombre}</td>
                    <td data-th="Estado">${nuevaEmpresa.estado}</td>
                    <td data-th="Ciudad">${nuevaEmpresa.ciudad}</td>
                    <td data-th="Calle">${nuevaEmpresa.calle}</td>
                    <td data-th="Sector">${nuevaEmpresa.sector}</td>
                    <td data-th="Carrera">${nuevaEmpresa.carrera}</td>
                    <td data-th="Plazas Disponibles">${nuevaEmpresa.plazas_disponibles}</td>
                    <td data-th="Numero Telefonico">${nuevaEmpresa.numero_telefonico}</td>
                    <td data-th="Representante">${nuevaEmpresa.representante}</td>
                    <td class="actions">
                        <button class="edit">Editar</button>
                        <button class="delete">Eliminar</button>
                    </td>
                `;
            tableBody.appendChild(row);

            // Limpiar el formulario
            addForm.reset();
            addForm.style.display = "none";
        } catch (error) {
            console.error("Error:", error);
            alert("Error al agregar la empresa");
        }
    });

</script>
